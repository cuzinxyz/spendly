<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spendly</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./theme.css" />
  </head>

  <body>
    <canvas id="bg"></canvas>

    <!-- ADD VIEW -->
    <div class="view" id="va">
      <div class="topbar">
        <span class="brand">Chi tiêu</span>
        <div class="topstats">
          <div class="ts un" data-action="show-list" title="Xem danh sách (L)">
            <div class="ts-l">Chưa trả</div>
            <div class="ts-v" id="ts-u">—</div>
          </div>
          <div class="ts pa" data-action="show-list" title="Xem danh sách (L)">
            <div class="ts-l">Đã trả</div>
            <div class="ts-v" id="ts-p">—</div>
          </div>
        </div>
      </div>

      <div class="stage">
        <div class="amt-wrap">
          <span class="sym" id="sym">₫</span>
          <input
            id="amt"
            type="text"
            inputmode="numeric"
            placeholder="0"
            autocomplete="off"
            tabindex="1"
            spellcheck="false"
          />
          <span class="caret"></span>
        </div>
        <div class="preview" id="prev"></div>

        <div class="note-row">
          <span class="note-arr">→</span>
          <input
            id="note"
            type="text"
            placeholder="ghi chú..."
            autocomplete="off"
            tabindex="2"
            spellcheck="false"
          />
        </div>

        <div class="note-row debt-row">
          <span class="note-arr">↳</span>
          <input
            id="debt"
            type="text"
            placeholder="nợ ai? bỏ trống nếu không có"
            autocomplete="off"
            tabindex="3"
            spellcheck="false"
          />
        </div>

        <div class="dt" id="dt">
          <div class="chip" id="chip-d">
            <span id="ld">hôm nay</span
            ><input type="date" id="din" tabindex="4" />
          </div>
          <div class="chip" id="chip-t">
            <span id="lt">bây giờ</span
            ><input type="time" id="tin" tabindex="5" />
          </div>
        </div>
      </div>

      <div class="hints">
        <span class="h"><span class="k">Tab</span> chuyển ô</span>
        <span class="h"><span class="k">↵ Enter</span> lưu</span>
        <span class="h"><span class="k">L</span> danh sách</span>
        <span class="h"><span class="k">Esc</span> xoá trắng</span>
      </div>
    </div>

    <!-- LIST VIEW -->
    <div class="view off" id="vl">
      <div class="lh">
        <span class="lh-t">Lịch sử chi tiêu</span>
        <span class="lh-back" onclick="showAdd()"
          ><span class="k">Esc</span> quay lại thêm</span
        >
      </div>
      <div class="lsum">
        <div class="sc un">
          <div class="sc-l">Chưa trả</div>
          <div class="sc-v" id="ls-u">0 ₫</div>
        </div>
        <div class="sc pa">
          <div class="sc-l">Đã trả</div>
          <div class="sc-v" id="ls-p">0 ₫</div>
        </div>
      </div>
      <div class="lscroll">
        <div class="empty" id="empty">
          <div class="empty-dash"></div>
          <div class="empty-t">
            Chưa có khoản nào.<br />Nhấn
            <strong style="color: var(--text2)">Esc</strong> để bắt đầu thêm.
          </div>
        </div>
        <div id="list"></div>
      </div>
    </div>

    <div class="flash" id="flash"></div>
    <div class="toast" id="toast"></div>

    <script src="./main.js"></script>
  </body>
</html>
